<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#475569" fill-opacity="0.35" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.65; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes radarPulse {
      0% { r: 10; opacity: 0.8; }
      100% { r: 65; opacity: 0; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; }
    .float-1 { animation: floatCard1 5s ease-in-out infinite; }
    .float-2 { animation: floatCard2 6s ease-in-out infinite; }
    .data-flow { stroke-dasharray: 8 12; animation: flowLine 3s linear infinite; }
    .radar { animation: radarPulse 3s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Animated Ambient Orbs in Background -->
  <circle class="orb-1" cx="200" cy="80" r="120" fill="#6366f1" filter="url(#softGlow)" />
  <circle class="orb-1" cx="1020" cy="280" r="140" fill="#ec4899" filter="url(#softGlow)" />
  <circle class="orb-1" cx="950" cy="80" r="100" fill="#06b6d4" filter="url(#softGlow)" />

  <!-- Background Data Flow Circuit Lines -->
  <g opacity="0.35">
    <path class="data-flow" d="M 50 180 L 300 180 L 380 260 L 820 260 L 900 180 L 1150 180" fill="none" stroke="url(#primaryGlow)" stroke-width="2" />
    <path class="data-flow" d="M 100 80 L 250 80 L 320 140 L 880 140 L 950 80 L 1100 80" fill="none" stroke="#06b6d4" stroke-width="1.5" />
  </g>

  <!-- Floating Dynamic Tech Cards / Badges (Side Elements) -->
  <g class="float-1" transform="translate(930, 60)" opacity="0.9">
    <rect width="210" height="68" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" fill-opacity="0.85" filter="url(#neonGlow)" />
    <circle cx="28" cy="34" r="12" fill="#0ea5e9" fill-opacity="0.2" />
    <circle cx="28" cy="34" r="6" fill="#38bdf8" />
    <text x="52" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Revenue Signals</text>
    <text x="52" y="48" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Real-Time Intent • 99.4%</text>
  </g>

  <g class="float-2" transform="translate(910, 160)" opacity="0.9">
    <rect width="230" height="72" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" fill-opacity="0.85" filter="url(#neonGlow)" />
    <circle cx="30" cy="36" r="12" fill="#a855f7" fill-opacity="0.2" />
    <polygon points="30,28 37,42 23,42" fill="#c084fc" />
    <text x="54" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Cross-App Sync</text>
    <text x="54" y="50" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">CRM ⇄ Billing ⇄ Data Lake</text>
  </g>

  <g class="float-1" transform="translate(940, 255)" opacity="0.9">
    <rect width="195" height="58" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5" fill-opacity="0.85" filter="url(#neonGlow)" />
    <circle cx="26" cy="29" r="10" fill="#10b981" fill-opacity="0.2" />
    <circle cx="26" cy="29" r="5" fill="#34d399" />
    <text x="48" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">ASC 606 &amp; CPQ</text>
    <text x="48" y="43" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Continuous Audit Ready</text>
  </g>

  <!-- Left Radar Element -->
  <g transform="translate(90, 180)">
    <circle class="radar" cx="0" cy="0" r="15" fill="none" stroke="#6366f1" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#818cf8" />
  </g>

  <!-- Foreground Title and Hero Content (Clean & Always on Top) -->
  <g transform="translate(140, 105)">
    <!-- Pill Category Badge -->
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <text x="14" y="21" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">⚡ REVOPS &amp; REVENUE INTELLIGENCE</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Cross-App Contextual
    </text>
    <text x="0" y="132" fill="url(#primaryGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Revenue Operations
    </text>

    <!-- Subtitle / Value Prop -->
    <text x="0" y="174" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500">
      Curated Ecosystem of Enterprise SaaS Leaders &amp; Production-Ready Open-Source Stacks
    </text>
    <text x="0" y="200" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
      Pipeline Hygiene • Deal Forecasting • Signal Discovery • Multi-Touch Attribution • Quote-to-Cash
    </text>
  </g>
</svg>
